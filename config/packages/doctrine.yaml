doctrine:
  dbal:
    types:
      datetime_immutable: App\Doctrine\Type\UTCDateTimeImmutableType
    default_connection: default
    connections:
      default:
        url: "%env(resolve:DATABASE_URL)%"
        charset: utf8mb4
        server_version: "11.4"
      # Parked (A8.4): unused at runtime. One-shot read of the old game DB
      # immediately before the first production deploy. Do not inject this
      # into live services. How-to: _deferred/legacy-migration.md
      legacy:
        url: "%env(resolve:DATABASE_LEGACY_URL)%"
        charset: utf8mb4
        server_version: "11.4"

  orm:
    default_entity_manager: default
    entity_managers:
      default:
        connection: default
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
          App:
            type: attribute
            is_bundle: false
            dir: "%kernel.project_dir%/src/Entity"
            prefix: 'App\Entity'
            alias: App
      # Parked (A8.4): no entity mappings. Live code uses `default` only.
      legacy:
        connection: legacy

when@prod:
  doctrine:
    orm:
      query_cache_driver:
        type: pool
        pool: doctrine.system_cache_pool
      result_cache_driver:
        type: pool
        pool: doctrine.result_cache_pool
