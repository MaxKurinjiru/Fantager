monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - tick_metrics

when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 7
                level: debug
                channels: ["!event", "!doctrine"]
                file_permission: 0666
                use_locking: true
            doctrine:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 7
                level: info
                channels: [doctrine]
                file_permission: 0666
                use_locking: true
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            sentry_breadcrumbs:
                type: service
                id: Sentry\Monolog\BreadcrumbHandler
                level: info
                channels: ["!tick_metrics"]
            sentry:
                type: service
                id: Sentry\Monolog\Handler
                level: error

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                file_permission: 0666

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!tick_metrics"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!tick_metrics"]
            tick_metrics:
                type: stream
                channels: [tick_metrics]
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            sentry_breadcrumbs:
                type: service
                id: Sentry\Monolog\BreadcrumbHandler
                level: info
                channels: ["!tick_metrics"]
            sentry:
                type: service
                id: Sentry\Monolog\Handler
                level: error
