# =============================================================================
# Fantager Route Map
# Routes are auto-discovered from PHP #[Route] attributes on controllers.
# Legacy explicit entries below kept for routes that pre-date attribute usage.
# =============================================================================

# --- Auto-discovered from #[Route] attributes ---
controllers_web:
  resource: ../src/Controller/Web/
  type: attribute

controllers_api:
  resource: ../src/Controller/Api/V1/
  type: attribute

# Infra lives next to Web/API, not under those trees — import the file, not src/Controller/.
controllers_health:
  resource: ../src/Controller/HealthCheckController.php
  type: attribute
