framework:
    messenger:
        # Doctrine transport — stores messages in the messenger_messages table in MariaDB.
        # No Redis or RabbitMQ needed. The table is created automatically on first use.
        # Single queue transport: processed strictly in order of scheduled execution time (available_at ASC, oldest first).
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: default
                    auto_setup: true
                retry_strategy:
                    max_retries: 0

        routing:
            'App\Message\ExecuteSingleTickMessage': async
            'App\Message\CombatWave': async
            'App\Message\ProcessCombatRound': async
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async


